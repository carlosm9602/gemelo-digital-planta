[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemelo-digital-planta"
version = "0.1.0"
description = "Gemelo digital de un proceso de nivel y caudal: simulador con lazo PID, servidor Modbus TCP y OPC UA, tablero SCADA web en tiempo real, inyección de fallas y detección de anomalías con ML."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carlos Mario Hidalgo Becerra" }]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  # 3.9+ cambió la API del datastore; se fija la rama 3.8 que es estable
  "pymodbus>=3.8,<3.9",
]

[project.optional-dependencies]
opcua = ["asyncua>=1.1"]
notebook = ["jupyter>=1.0", "matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "pre-commit>=3", "asyncua>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # el formateador decide el largo; los textos largos en español no se parten

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
