name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Pruebas
        # el código 5 de pytest significa "no hay pruebas todavía": no rompe el CI
        run: pytest -v || [ $? -eq 5 ]
